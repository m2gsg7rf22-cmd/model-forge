[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge-research"
version = "0.2.0"
description = "Evidence-based local model inspection and reconstruction research desktop"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2,<3", "psutil>=6,<8", "mcp>=1.20,<2", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
llm = ["torch>=2.6,<3", "transformers>=4.57,<5", "peft>=0.18,<1", "accelerate>=1,<2", "safetensors>=0.6,<1"]
mlx = ["torch>=2.6,<3", "transformers>=4.57,<5", "peft>=0.18,<1", "accelerate>=1,<2", "safetensors>=0.6,<1", "mlx>=0.30,<1; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx-lm>=0.29,<0.30; sys_platform == 'darwin' and platform_machine == 'arm64'"]
onnx = ["onnx>=1.17,<2"]
dev = ["pytest>=8", "pytest-cov", "mypy", "ruff", "black", "build", "pyinstaller"]

[project.scripts]
modelforge = "modelforge.cli:main"
modelforge-mcp = "modelforge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
module = ['torch.*', 'transformers.*', 'peft.*', 'mlx.*', 'mlx_lm.*', 'safetensors.*']
follow_imports = 'skip'
