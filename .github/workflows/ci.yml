name: Verify and package
on:
  push:
  workflow_dispatch:
    inputs:
      reconstruction_only:
        description: Run only the bounded NumPy reconstruction core
        type: boolean
        default: false
      tests_only:
        description: 'Run full tests, lint, types and clean installation without native rebuilds'
        type: boolean
        default: false
      mcp_only:
        description: 'Verify only changed MCP startup/bootstrap paths; preserve prior full-suite evidence'
        type: boolean
        default: false
      platforms:
        description: 'JSON array of runner labels for targeted acceptance'
        type: string
        default: '["ubuntu-22.04","windows-latest","macos-14"]'
      windows_only:
        description: 'Run only Windows when other native packages are already verified'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test-package:
    if: github.event.inputs.reconstruction_only != 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event.inputs.windows_only == 'true' && fromJSON('["windows-latest"]') || fromJSON(github.event.inputs.platforms || '["ubuntu-22.04","windows-latest","macos-14"]') }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MODELFORGE_HOME: ${{ github.workspace }}/acceptance-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: CPU Torch wheels on Linux and Windows
        if: runner.os != 'macOS'
        run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[desktop,dev,onnx,llm]"
      - run: python -m pytest -q ${{ github.event.inputs.mcp_only == 'true' && 'tests/test_mcp_client.py tests/test_local_service_e2e.py::test_real_new_mcp_tools_with_local_preflight_and_research tests/test_bootstrap.py tests/test_research_memory.py tests/test_research_integration.py::test_actual_mcp_research_and_recovery_tools' || '' }} --junitxml=acceptance.xml
      - run: python -m mypy src/modelforge
      - run: python -m ruff check src tests packaging
      - run: python packaging/check_install.py
      - if: github.event.inputs.tests_only != 'true'
        run: python -m build
      - if: github.event.inputs.tests_only != 'true'
        run: python packaging/build_desktop.py
      - name: Smoke test frozen Linux desktop
        if: runner.os == 'Linux' && github.event.inputs.tests_only != 'true'
        run: dist/ModelForge/ModelForge --smoke-test
      - name: Smoke test frozen macOS desktop
        if: runner.os == 'macOS' && github.event.inputs.tests_only != 'true'
        run: dist/ModelForge.app/Contents/MacOS/ModelForge --smoke-test
      - name: Smoke test frozen Windows desktop
        if: runner.os == 'Windows' && github.event.inputs.tests_only != 'true'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/ModelForge/ModelForge.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen GUI failed: $($p.ExitCode)" }
      - name: Archive binaries and checksums
        if: github.event.inputs.tests_only != 'true'
        run: python packaging/archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: ModelForge-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            acceptance.xml
  reconstruction-core:
    if: github.event.inputs.reconstruction_only == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      MODELFORGE_PRIVATE_HOME: ${{ runner.temp }}/unused-private
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core only
        run: python -m pip install . pytest mypy ruff pyyaml
      - name: Actual algebra, artifacts and MCP
        run: python -m pytest tests/test_antipodal.py tests/test_antipodal_io.py -q --junitxml=antipodal-acceptance.xml
      - name: Changed backend types
        run: python -m mypy --follow-imports=silent src/modelforge/antipodal.py src/modelforge/antipodal_io.py src/modelforge/service.py src/modelforge/runtime_worker.py src/modelforge/mcp_server.py src/modelforge/cli.py
      - name: Changed source lint
        run: python -m ruff check src/modelforge/antipodal.py src/modelforge/antipodal_io.py examples/antipodal_research.py tests/test_antipodal.py tests/test_antipodal_io.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Antipodal-core-${{ runner.os }}
          path: antipodal-acceptance.xml
